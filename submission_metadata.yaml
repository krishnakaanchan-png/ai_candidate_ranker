ai_usage_summary: |
  Used Gemini 3.1 Pro (Antigravity Agent) for architecture design, code writing (precompute.py, rank.py), debugging OpenMP issues, and generating methodology documentation.

methodology_summary: |
  A two-phase architecture using sentence-transformers to embed candidate profiles offline into a FAISS index, followed by instantaneous semantic retrieval and behavioral re-ranking at runtime.

